<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synaptic Fitness – Gym Management</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171c;--mu:#667085;--bd:#e3e6ea;--ac:#1f4fd8;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eceef2;--mu:#98a2b3;--bd:#2a2e36;--ac:#6b8cff}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#eceef2;--mu:#98a2b3;--bd:#2a2e36;--ac:#6b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0 12px 0 0}nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx)}
nav button,.btn{padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:16px;max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.stat b{display:block;font-size:26px}.stat span,.mu{color:var(--mu);font-size:13px}
input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.row .btn{flex:0 0 auto}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.b{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.Active{background:var(--g)}.Expiring{background:var(--y)}.Expired{background:var(--r)}
.res{border-radius:12px;padding:22px;text-align:center;color:#fff;margin-top:12px}.res h2{margin:0 0 4px}
.chip{display:inline-block;margin:3px;padding:5px 10px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:13px}
h3{margin:0 0 10px;font-size:15px}
</style><style>
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0a0a0a;--card:#141414;--tx:#f4f4f4;--mu:#9a9a9a;--bd:#2a2a2a;--ac:#e11d1d}
header{background:#000;border-bottom:3px solid var(--ac);gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin-right:14px}.logo img{height:44px;width:44px;border-radius:8px}
.logo b{font-size:18px;letter-spacing:1.5px;text-transform:uppercase;font-style:italic;font-weight:900;line-height:1}.logo b em{display:block;color:var(--ac);font-size:11px;letter-spacing:4px;font-style:normal}
nav button{background:#000;color:#ddd;text-transform:uppercase;font-size:12px;letter-spacing:1px;font-weight:700}
nav button.on,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{background:#ff2a2a}.card{border-top:2px solid var(--ac)}.stat b{color:var(--ac)}h3{text-transform:uppercase;letter-spacing:1px;font-size:13px}
.res h2{font-style:italic;text-transform:uppercase;letter-spacing:1px}input:focus,select:focus{outline:2px solid var(--ac)}

const D=864e5,T0=new Date();T0.setHours(0,0,0,0);

mem=ci.filter(c=>c.type==='Member'),un=new Set(mem.map(c=>c.who)).size,ex=M.filter(m=>st(m)==='Expired').length;
const rows=rp==='Daily'?[['Total check-ins',ci.length],['Members',mem.length],['Walk-ins',ci.length-mem.length],['New registrations',nw],['Membership payments',peso(sum(mp))],['Walk-in revenue',peso(sum(wi))],['Other revenue',peso(sum(ot))],['Total revenue',peso(sum(pp))]]:[['Total visits',ci.length],['Unique members',un],['Walk-ins',ci.length-mem.length],['New members',nw],['Renewals',rn],['Expired memberships',ex],['Membership revenue',peso(sum(mp))],['Walk-in revenue',peso(sum(wi))],['Total revenue',peso(sum(pp))]];
const days=[...Array(14)].map((_,i)=>{const d=day(i-13);return{l:fd(d),v:P.filter(p=>new Date(p.at).setHours(0,0,0,0)===+d).reduce((a,p)=>a+p.amt,0)}});
return `<div class="row" style="margin-bottom:12px">${['Daily','Monthly'].map(k=>`<button class="btn ${rp===k?'p':''}" onclick="rp='${k}';render()">${k==='Daily'?'Daily (today)':'Monthly (last 30 days)'}</button>`).join('')}</div>
<div class="grid">${rows.map(r=>sc(r[1],r[0])).join('')}</div><div class="card"><h3>Revenue — last 14 days</h3>${bars(days,x=>peso(x.v))}</div>`};
V.Analytics=()=>{const mx=a=>Math.max(1,...a.map(x=>x.v)),hrs=[...Array(17)].map((_,i)=>({l:hr(i+6),v:C.filter(c=>c.at.getHours()===i+6).length})).filter(x=>x.v),
wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((l,i)=>({l,v:C.filter(c=>c.at.getDay()===i).length})),
nd=new Set(C.map(c=>c.at.toDateString())).size||1,mv=C.filter(c=>c.type==='Member'),
cnt={};mv.forEach(c=>cnt[c.who]=(cnt[c.who]||0)+1);
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>({l:x[0].split(' ')[0],v:x[1]})),
ina=M.filter(m=>st(m)!=='Expired'&&(!lastV(m)||lastV(m)<day(-7))),
act=M.filter(m=>st(m)!=='Expired').length,rn=P.filter(p=>p.svc.startsWith('Renewal')&&p.at>=day(-29)).length,ex=M.length-act;
return `<div class="grid">${sc((C.length/nd).toFixed(1),'Avg daily attendance')}${sc((mv.length/M.length).toFixed(1),'Avg visits / member')}${sc(Math.round(act/M.length*100)+'%','Retention (active)')}${sc(rn+'/'+(rn+ex),'Renewed vs lapsed (30d)')}${sc(Math.round(mv.length/C.length*100)+'%','Visits by members')}</div>
<div class="card"><h3>Peak hours</h3>${bars(hrs,(x,m)=>x.v+' · '+traf(x.v/m))}</div>
<div class="card"><h3>Busiest days</h3>${bars(wd,(x,m)=>x.v+' · '+traf(x.v/m))}</div>
<div class="card"><h3>Most active members</h3>${bars(top)}</div>
<div class="card"><h3>Inactive members (no visit in 7+ days)</h3>${ina.map(m=>`<div class="row" style="align-items:center;margin-bottom:6px"><span>${m.name} <span class="mu">last visit ${lastV(m)?fd(lastV(m)):'never'}</span></span><button class="btn" onclick="sendN('${m.name}','Inactive nudge','We miss you! Come train this week.');render()">Send nudge</button></div>`).join('')||'<span class="mu">Everyone active has visited recently</span>'}</div>`};
V.Notifications=()=>`<div class="card"><h3>Announcement to active members</h3><form class="row" onsubmit="event.preventDefault();sendN('All active members','Announcement',this.elements.m.value);render()"><input name="m" placeholder="e.g. Gym closed Sunday for maintenance" required><button class="btn p">Send</button></form></div>
<div class="card"><h3>Sent log (simulated)</h3>${NL.map(n=>`<div style="margin-bottom:6px"><b>${n.type}</b> → ${n.to} <span class="mu">${tm(n.at)}</span><div class="mu">${n.msg}</div></div>`).join('')||'<span class="mu">Nothing sent yet — try the reminder buttons on the Dashboard.</span>'}</div>`;
let pe=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addPk(e){const f=Object.fromEntries(new FormData(e.target)),d=Math.max(1,Math.round(+f.d));PK.push({id:Math.max(...PK.map(p=>p.id))+1,n:f.n.trim(),p:+f.p,d,a:true,desc:f.desc.trim()});log('Added package',f.n.trim()+' — '+peso(+f.p)+', '+d+' days');render()}
function savePk(e,id){const f=Object.fromEntries(new FormData(e.target)),p=PK.find(x=>x.id===id),o=p.n+' '+peso(p.p)+'/'+p.d+'d';p.n=f.n.trim();p.p=+f.p;p.d=Math.max(1,Math.round(+f.d));p.desc=f.desc.trim();log('Edited package',o+' → '+p.n+' '+peso(p.p)+'/'+p.d+'d');pe=null;render()}
function togglePk(id){const p=PK.find(x=>x.id===id);if(p.a&&PK.filter(x=>x.a).length<2)return;p.a=!p.a;log(p.a?'Turned package on':'Turned package off',p.n);render()}
V['Packages']=()=>`<div class="card"><h3>Add package</h3><form class="row" onsubmit="event.preventDefault();addPk(event)"><input name="n" placeholder="Package name" required><input name="p" type="number" min="0" placeholder="Price ₱" required><input name="d" type="number" min="1" step="1" placeholder="Duration (days)" required><input name="desc" placeholder="Description (optional)"><button class="btn p">Add</button></form></div>
<div class="card"><h3>Packages</h3><div class="tbl"><table><tr><th>Name</th><th>Price</th><th>Days</th><th>Description</th><th>Status</th><th>Actions</th></tr>
${PK.map(p=>pe===p.id?`<tr><td colspan=6><form class="row" style="flex-wrap:nowrap" onsubmit="event.preventDefault();savePk(event,${p.id})"><input name="n" value="${esc(p.n)}" required><input name="p" type="number" min="0" value="${p.p}" required><input name="d" type="number" min="1" value="${p.d}" required><input name="desc" value="${esc(p.desc)}"><button class="btn p">Save</button><button type="button" class="btn" onclick="pe=null;render()">Cancel</button></form></td></tr>`:`<tr style="${p.a?'':'opacity:.5'}"><td>${esc(p.n)}</td><td>${peso(p.p)}</td><td>${p.d}</td><td>${esc(p.desc)||'—'}</td><td>${p.a?'Active':'Off'}</td><td><button class="btn" onclick="pe=${p.id};render()">Edit</button> <button class="btn" ${p.a&&PK.filter(x=>x.a).length<2?'disabled':''} onclick="togglePk(${p.id})">${p.a?'Turn off':'Turn on'}</button></td></tr>`).join('')}</table></div><div class="mu" style="margin-top:8px">Price changes apply to new sales only. Existing members and past payments keep their original details.</div></div>`;
V['Audit Log']=()=>`<div class="card"><h3>Audit log (${AL.length})</h3><div class="tbl"><table><tr><th>When</th><th>By</th><th>Action</th><th>Details</th></tr>${AL.map(a=>`<tr><td>${fd(a.at)} ${tm(a.at)}</td><td>${a.by}</td><td>${a.action}</td><td>${a.d}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">No activity yet. Renew, edit, register or record a measurement to see entries.</td></tr>'}</table></div></div>`;
let mq='';
V._f=V['Front Desk'];
V['Front Desk']=()=>{const r=mq?M.filter(m=>(m.name+m.id+m.phone).toLowerCase().includes(mq.toLowerCase())).slice(0,5):[];
return V._f()+`<div class="card"><h3>Manual check-in (no QR)</h3><form class="row" onsubmit="event.preventDefault();mq=this.elements.q.value;render()"><input name="q" placeholder="Search name, ID or phone" value="${mq}"><button class="btn">Search</button></form>
${r.map(m=>`<div class="row" style="align-items:center;margin-top:8px"><span style="flex:2"><img src="${m.photo}" style="width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px">${m.name} ${badge(m)}</span><select id="rs${m.id}"><option>Forgot phone</option><option>Phone battery dead</option><option>New phone</option><option>Other</option></select><button class="btn p" onclick="manual('${m.id}',document.getElementById('rs${m.id}').value)">Check in</button></div>`).join('')}${mq&&!r.length?'<div class="mu" style="margin-top:8px">No match</div>':''}<div class="mu" style="margin-top:8px">Manual check-ins are logged under your name in the audit log.</div></div>`};
V._p=V.Payments;
V.Payments=()=>V._p()+(VOID.length?`<div class="card"><h3>Voided transactions</h3>${VOID.map(p=>`<div>${p.id} — ${p.who} — ${p.svc} — ${peso(p.amt)} <span class="mu">voided ${tm(p.voided)}</span></div>`).join('')}</div>`:'');
let sess=null,mt='Home',err='',pmsg='';
const mm=()=>M.find(x=>x.id===pm);
const mcs=m=>C.filter(c=>c.who===m.name&&c.type==='Member').sort((a,b)=>b.at-a.at);
function login(id,pin){const m=M.find(x=>x.id.toLowerCase()===id.trim().toLowerCase());
if(m&&m.phone.replace(/\D/g,'').slice(-4)===pin.replace(/\D/g,'')){sess='member';pm=m.id;mt='Home';err=''}else err='Member ID or PIN is incorrect.';render()}
function updP(e){const f=Object.fromEntries(new FormData(e.target)),m=mm();m.phone=f.phone;m.email=f.email;m.em=f.em;log('Profile updated',m.name+' changed contact info');pmsg='Profile updated ✓';render()}
const loginV=()=>`<div style="max-width:400px;margin:24px auto"><div class="card"><h3>Member login</h3>
<form onsubmit="event.preventDefault();login(this.elements.id.value,this.elements.pin.value)"><input name="id" placeholder="Member ID (e.g. M1001)" style="margin-bottom:8px" required>
<input name="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN – last 4 digits of your phone" style="margin-bottom:10px" required>
${err?`<div style="color:var(--r);margin-bottom:8px">${err}</div>`:''}<button class="btn p" style="width:100%">View my account</button></form>
<div class="row" style="flex-wrap:nowrap;margin-top:10px"><button type="button" class="btn" onclick="login('M1001','0000')">Try demo member</button><button type="button" class="btn" onclick="login('M1006','5555')">Try expired member</button></div><div class="mu" style="margin-top:6px">Or type M1001 / 0000. A member you register logs in with their ID and the last 4 digits of the phone you entered.</div></div>
<div class="card"><h3>Staff &amp; coaches</h3><div class="row" style="flex-wrap:nowrap"><button class="btn" onclick="staffIn('Admin')">Admin</button><button class="btn" onclick="staffIn('Coach')">Coach</button><button class="btn" onclick="staffIn('Front Desk')">Front Desk</button></div><div class="mu" style="margin-top:8px">Demo logins — each role sees different tabs and actions.</div></div></div>`;
const MV={
Home:()=>{const m=mm(),ok=st(m)!=='Expired',cs=mcs(m),w=W[m.id],mo=cs.filter(c=>c.at.getMonth()===T0.getMonth()&&c.at.getFullYear()===T0.getFullYear()).length;
return `<div style="max-width:420px;margin:auto"><h2 style="margin:0 0 10px">Hi, ${m.name.split(' ')[0]} 👋</h2>${nextBd(m)===0?'<div class="card">🎂 Happy birthday from Synaptic Fitness!</div>':''}
${st(m)==='Expiring'?`<div class="card" style="border-color:var(--y)">⚠️ Your membership expires ${fd(m.exp)}. Renew at the front desk to keep training.</div>`:''}${!ok?'<div class="card" style="border-color:var(--r)">Your membership has expired. Please renew at the front desk.</div>':''}
<div class="card" style="text-align:center"><h3>My membership card</h3><img src="${m.photo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:6px"><div style="font-size:20px;font-weight:800">${m.name}</div><div class="mu">${m.id}</div><p>${badge(m)}</p><div class="mu">${m.pkg} · expires ${fd(m.exp)}</div>
<div id="qr" style="background:#fff;display:inline-block;padding:10px;border-radius:10px;margin-top:12px;${ok?'':'opacity:.25'}"></div><div class="mu" style="margin-top:6px">${ok?'Show at the front desk. Screenshot it — this QR never changes and works offline.':'QR disabled until renewed'}</div></div>
<div class="grid" style="grid-template-columns:repeat(3,1fr)">${sc(mo,'Visits this month')}${sc(left(m),'Days left')}${sc(w[w.length-1].kg,'Current kg')}</div></div>`},
Attendance:()=>{const m=mm(),cs=mcs(m),mo=cs.filter(c=>c.at.getMonth()===T0.getMonth()&&c.at.getFullYear()===T0.getFullYear()).length;
return `<div style="max-width:420px;margin:auto"><div class="grid" style="grid-template-columns:repeat(3,1fr)">${sc(cs.length,'Total visits')}${sc(mo,'This month')}${sc(cs[0]?fd(cs[0].at):'—','Last visit')}</div>
<div class="card"><h3>History</h3>${cs.slice(0,25).map(c=>`<div>${c.at.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})} — ${tm(c.at)}</div>`).join('')||'<span class="mu">No visits yet</span>'}</div></div>`},
Progress:()=>{const w=W[pm],ch=w[w.length-1].kg-w[0].kg;
return `<div style="max-width:420px;margin:auto"><div class="grid" style="grid-template-columns:repeat(3,1fr)">${sc(w[0].kg,'Start kg')}${sc(w[w.length-1].kg,'Current kg')}${sc((ch>0?'+':'')+ch.toFixed(1),'Change kg')}</div>
<div class="card"><h3>Weight trend</h3>${chart(w)}</div>
<div class="card"><h3>Update my weight</h3><form class="row" onsubmit="event.preventDefault();logW(event)"><input name="kg" type="number" step="0.1" placeholder="Weight (kg)" required><input name="waist" type="number" step="0.1" placeholder="Waist cm (opt.)"><input name="fat" type="number" step="0.1" placeholder="Body fat % (opt.)"><button class="btn p">Save</button></form>
<div class="mu" style="margin:10px 0 4px">History</div>${[...w].reverse().map(x=>`<div>${fd(x.at)} — ${x.kg} kg${x.waist?' · waist '+x.waist:''}${x.fat?' · '+x.fat+'% fat':''} <span class="mu">by ${x.by}</span></div>`).join('')}</div></div>`},
Profile:()=>{const m=mm();
return `<div style="max-width:420px;margin:auto"><div class="card"><h3>My details</h3>
<div>${m.name}</div><div class="mu">${m.id} · Birthday ${m.bd?new Date(2000,m.bd[0],m.bd[1]).toLocaleDateString('en-PH',{month:'long',day:'numeric'}):'—'} · ${m.ht} cm</div>
<div class="mu">${m.pkg} · expires ${fd(m.exp)} ${badge(m)}</div><div class="mu" style="margin-top:6px">Name, ID and membership can only be changed by staff.</div></div>
<div class="card"><h3>Contact info</h3><form onsubmit="event.preventDefault();updP(event)">
<label class="mu">Phone</label><input name="phone" value="${m.phone}" style="margin-bottom:8px"><label class="mu">Email</label><input name="email" value="${m.email}" style="margin-bottom:8px">
<label class="mu">Emergency contact (optional)</label><input name="em" value="${m.em}" placeholder="Name – phone" style="margin-bottom:10px"><button class="btn p" style="width:100%">Save changes</button>${pmsg?`<div style="color:var(--g);margin-top:8px">${pmsg}</div>`:''}</form></div></div>`}};
function render(keep){const nav=document.getElementById('nav'),v=document.getElementById('v'),out='<button style="margin-left:auto" onclick="sess=null;err=\'\';render()">Log out</button>';
if(!sess){nav.innerHTML='';v.innerHTML=loginV();return}
if(sess!=='staff'){nav.innerHTML=Object.keys(MV).map(k=>`<button class="${k===mt?'on':''}" onclick="mt='${k}';pmsg='';render()">${k}</button>`).join('')+out;try{v.innerHTML=MV[mt]();if(mt==='Home')post()}catch(x){v.innerHTML='<div class="card">Something went wrong: '+esc(x.message)+'</div>'}return}
renderStaff(keep);nav.insertAdjacentHTML('beforeend','<span class="mu" style="margin-left:auto">'+staff.name+' · '+staff.role+'</span>'+out.replace('margin-left:auto',''))}
function renderStaff(keep){document.getElementById('nav').innerHTML=Object.keys(V).filter(k=>k[0]!='_'&&k!=='Member Portal'&&TABS[staff.role].includes(k)).map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';res=null;render()">${k}</button>`).join('');
 document.getElementById('v').innerHTML=V[tab]();if(tab==='Member Portal')post();if(keep){const s=document.getElementById('s');s.focus();s.setSelectionRange(q.length,q.length)}}
render();
</script></body></html>
